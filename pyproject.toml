[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "par-model"
version = "1.0.0"
description = "Leakage-safe multi-task person attribute recognition with ConvNeXt"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aishwarya Anand"}]
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "timm>=1.0,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]
notebook = [
  "albumentations>=1.4.18,<2.1",
  "jupyter>=1.0,<2",
  "matplotlib>=3.8,<4",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
]

[project.scripts]
par-predict = "par_model.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
  "slow: model construction or inference checks",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["archive", "notebooks"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
